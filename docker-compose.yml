services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: opportunity_hunter
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d opportunity_hunter"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - opportunity_hunter_db:/var/lib/postgresql/data

volumes:
  opportunity_hunter_db:

